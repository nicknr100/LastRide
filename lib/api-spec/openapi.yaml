openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trains
    description: Train timetable lookups (last and first trains)
  - name: stations
    description: Station lookups
  - name: taxi
    description: Taxi estimates
  - name: walk
    description: Walking routes
  - name: places
    description: Places to wait for the first train
  - name: usage
    description: Paid API usage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trains/last:
    get:
      operationId: getLastTrain
      tags: [trains]
      summary: Last train tonight
      description: >-
        The last departure from the origin station on the given service date
        that still reaches the destination station.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/FromName"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - $ref: "#/components/parameters/ToName"
        - $ref: "#/components/parameters/ServiceDate"
      responses:
        "200":
          description: Last train route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainRoute"
        "404":
          description: No train route between the stations on that date
        "502":
          description: Timetable provider unavailable
  /trains/first:
    get:
      operationId: getFirstTrain
      tags: [trains]
      summary: First train of the service day
      description: The first departure from the origin station on the given service date toward the destination.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/FromName"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - $ref: "#/components/parameters/ToName"
        - $ref: "#/components/parameters/ServiceDate"
      responses:
        "200":
          description: First train route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainRoute"
        "404":
          description: No train route between the stations on that date
        "502":
          description: Timetable provider unavailable
  /stations/nearby:
    get:
      operationId: getNearbyStations
      tags: [stations]
      summary: Stations near a point
      description: Closest stations by walking route (accounting for station exits), nearest first.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - name: pace
          in: query
          required: true
          schema: { type: string, enum: [relaxed, normal, fast] }
        - name: limit
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 10, default: 5 }
      responses:
        "200":
          description: Nearby stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "502":
          description: Station provider unavailable
  /stations/search:
    get:
      operationId: searchStations
      tags: [stations]
      summary: Search stations by name
      parameters:
        - name: q
          in: query
          required: true
          description: Station name in Japanese or kana
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "200":
          description: Matching stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "502":
          description: Station provider unavailable
  /taxi:
    get:
      operationId: getTaxiEstimate
      tags: [taxi]
      summary: Taxi time and fare estimate
      description: Driving distance and time, with a fare estimate using regional rates and the late-night surcharge.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - name: startTime
          in: query
          required: true
          description: Departure time in Japan (YYYY-MM-DDThh:mm:ss)
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$" }
      responses:
        "200":
          description: Taxi estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxiEstimate"
        "404":
          description: No driving route
        "502":
          description: Routing provider unavailable
  /walk:
    get:
      operationId: getWalkRoute
      tags: [walk]
      summary: Walking route
      description: Walking distance and time along the pedestrian network, at the given pace.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - name: pace
          in: query
          required: true
          schema: { type: string, enum: [relaxed, normal, fast] }
      responses:
        "200":
          description: Walking route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkRoute"
        "404":
          description: No walking route
        "502":
          description: Routing provider unavailable
  /places/nearby:
    get:
      operationId: getNearbyPlaces
      tags: [places]
      summary: Places to stay near a point
      description: Net cafés, karaoke, capsule hotels and hotels within walking distance, nearest first.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Nearby places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Place"
        "502":
          description: Place provider unavailable
  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Paid API usage
      description: Real (uncached) calls to each paid provider today and this month, in Japan time.
      responses:
        "200":
          description: Usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReport"
components:
  parameters:
    FromLat:
      name: fromLat
      in: query
      required: true
      schema: { type: number }
    FromLon:
      name: fromLon
      in: query
      required: true
      schema: { type: number }
    FromName:
      name: fromName
      in: query
      required: true
      description: Japanese station name, used to pick the right station near the coordinates
      schema: { type: string }
    ToLat:
      name: toLat
      in: query
      required: true
      schema: { type: number }
    ToLon:
      name: toLon
      in: query
      required: true
      schema: { type: number }
    ToName:
      name: toName
      in: query
      required: true
      schema: { type: string }
    ServiceDate:
      name: date
      in: query
      required: true
      description: Rail service date (YYYYMMDD); trains after midnight belong to the previous date
      schema: { type: string, pattern: "^[0-9]{8}$" }
  schemas:
    TrainRoute:
      type: object
      properties:
        departsAt:
          type: string
          description: Departure from the origin station (ISO 8601 with +09:00 offset)
        arrivesAt:
          type: string
          description: Arrival at the destination station (ISO 8601 with +09:00 offset)
        transfers:
          type: number
          description: Number of changes between trains
        fareYen:
          type: [number, "null"]
          description: One-way fare including express charges, in yen; null when unknown
        legs:
          type: array
          items:
            $ref: "#/components/schemas/TrainLeg"
      required: [departsAt, arrivesAt, transfers, fareYen, legs]
    Station:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Romanized name for display in English
        nameJa:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        region:
          type: string
        walkingMeters:
          type: number
        walkingMinutes:
          type: number
      required: [id, name, nameJa, latitude, longitude]
    UsageReport:
      type: object
      properties:
        date:
          type: string
        month:
          type: string
        today:
          type: object
          additionalProperties: { type: number }
        thisMonth:
          type: object
          additionalProperties: { type: number }
        monthlyLimits:
          type: object
          additionalProperties: { type: number }
      required: [date, month, today, thisMonth, monthlyLimits]
    Place:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [net-cafe, karaoke, capsule, hotel]
        latitude:
          type: number
        longitude:
          type: number
        distanceMeters:
          type: number
          description: Straight-line distance from the search point
        phone:
          type: string
        open24h:
          type: boolean
          description: Present only when opening hours are known
      required: [name, kind, latitude, longitude, distanceMeters]
    WalkRoute:
      type: object
      properties:
        distanceMeters:
          type: number
        minutes:
          type: number
      required: [distanceMeters, minutes]
    TaxiEstimate:
      type: object
      properties:
        distanceMeters:
          type: number
        minutes:
          type: number
        fareYen:
          type: [number, "null"]
          description: Estimated fare in yen, excluding tolls; null when unavailable
      required: [distanceMeters, minutes, fareYen]
    TrainLeg:
      type: object
      properties:
        line:
          type: string
        lineEn:
          type: string
          description: English line name, or the Japanese name if it isn't recognised
        from:
          type: string
        fromEn:
          type: string
        to:
          type: string
        toEn:
          type: string
        departsAt:
          type: string
        arrivesAt:
          type: string
      required: [line, lineEn, from, fromEn, to, toEn, departsAt, arrivesAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

